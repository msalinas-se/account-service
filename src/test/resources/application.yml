spring:
  application:
    name: account-service
  cloud:
    config:
      enabled: false

services:
  customer:
    url: http://localhost:8081
  credit:
    url: http://localhost:8083

circuit-breaker:
  timeout: 2s

eureka:
  client:
    enabled: false

topics:
  debt-status: debt-status
  wallet-link: wallet-link
  wallet-link-result: wallet-link-result
  wallet-payment: wallet-payment
  wallet-payment-result: wallet-payment-result
